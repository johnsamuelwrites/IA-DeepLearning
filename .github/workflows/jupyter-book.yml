# Build the course website with Jupyter Book 2 (MyST) and publish it to GitHub Pages.
# Based on
#   1. https://github.com/uwdata/visualization-curriculum/blob/main/.github/workflows/build-book.yml
#   2. https://next.jupyterbook.org/start/publish
name: jupyter-book

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Jupyter Book 2 is a thin wrapper around mystmd, which runs on Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Setting up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Notebooks are not executed at build time, so the course requirements are not needed here
      - name: Install Jupyter Book
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jupyter-book>=2,<3"

      # Build Jupyter Book. The site is served from https://<user>.github.io/<repo>/,
      # so MyST needs the repository name as base URL to resolve its assets.
      - name: Build Jupyter book
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter-book build --html

      # Runs a set of commands using the runners shell
      - name: Push Jupyter book to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
