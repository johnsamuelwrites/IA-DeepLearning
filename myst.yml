        - file: fr/TP2/TP2.md
        - file: fr/TP3/TP3.ipynb
        - file: fr/Projet/miniprojet.md
        - file: fr/Projet/projet.md
    - title: English
      children:
        - file: en/README.md
        - file: en/practical1/practical0.ipynb
        - file: en/practical1/practical1.ipynb
        - file: en/practical2/practical2.md
        - file: en/practical3/practical3.ipynb
        - file: en/Project/miniproject.md
        - file: en/Project/project.md
site:
  options:
    logo: deeplearning.svg
    folders: true
  template: book-theme
