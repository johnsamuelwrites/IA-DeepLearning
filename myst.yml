version: 1
project:
  title: Artificial Intelligence and Deep Learning
  authors:
    - name: John Samuel
  copyright: 2020-2026
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  github: johnsamuelwrites/IA-DeepLearning
  thebe:
    binder:
      repo: johnsamuelwrites/IA-DeepLearning
